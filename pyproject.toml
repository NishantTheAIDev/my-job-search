[project]
name = "my-job-search"
version = "0.1.0"
description = "AI-powered job search and application assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlmodel>=0.0.22",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "python-docx>=1.1.2",
    "pypdf>=4.3.0",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.34.0",
    "httpx",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = [
    "E712",   # SQLAlchemy requires `== True` in WHERE clauses; `is True` doesn't work
    "B008",   # FastAPI uses function calls in default arguments (Depends, File, Query)
    "SIM117", # nested `with` statements are fine for session + asyncio.run patterns
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt strings are intentionally long prose — wrapping would break the text
"backend/llm/prompts/*.py" = ["E501"]
# Test files can use longer lines for assertion messages and fixture data
"tests/**/*.py" = ["E501"]
